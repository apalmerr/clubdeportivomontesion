# Sitio estático: publicar la raíz del repo (no dist/)
[build]
  command = "exit 0"
  publish = "."

# Redirecciones útiles
[[redirects]]
  from = "/menu"
  to = "/carta/"
  status = 302

# Si alguien entra a /es sin barra
[[redirects]]
  from = "/es"
  to = "/es/"
  status = 301

[[redirects]]
  from = "/ca"
  to = "/ca/"
  status = 301

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
